{% extends 'base.html' %}

{% block titulo %} - Home{% endblock %}

{% block usuario %} Pedro {% endblock %}


{% block conteudo %}
    <div class="card">
      <div class="card-body">
        <form class="row g-3" method="POST" action="{{ url_for('movimentacao') }}">
            <div class="col-md-12">
                <label for="inputEmail4" class="form-label">Perfil</label>
                <select name="perfil" class="form-select">
                  <option selected>Selecione um perfil...</option>
                  {% for perfil in perfils %}
                  <option value="{{ perfil.id_perfil }}">{{ perfil.nome_perfil }}</option>
                  {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Ambiente</label>
                <select name="ambiente" class="form-select">
                    <option selected>Selecione o Ambiente</option>
                    {% for ambiente in ambientes %} 
                    <option value="{{ ambiente.id_ambiente }}">{{ ambiente.ambiente }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-6">
                <label for="inputAddress" class="form-label">Chave</label>
                <Select name="chave" class="form-select">
                    <option selected>Selecione a Chave</option>
                    {% for chave in chaves %} 
                    <option value="{{ chave.id_chave }}">{{ chave.nome_chave }}</option>
                    {% endfor %}
                </Select>
            </div>
            <div class="row col-12">

                <div class="col-7"></div>

                <div class="col-5">
                    <div class="d-flex align-items-end justify-content-end gap-2">

                        <!-- Data -->
                        <div>
                            <label for="dataReserva" class="form-label">Data</label>
                            <input type="date" class="form-control" id="dataReserva" name="data_movimentacao">
                        </div>

                        <!-- Horário -->
                        <div>
                            <label class="form-label">Horário</label>
                            <div class="d-flex align-items-center gap-1">
                                <input type="time" class="form-control" name="hora_inicio_movimentacao" id="horaInicio">
                                <span>:</span>
                                <input type="time" class="form-control" name="hora_fim_movimentacao" id="horaFim">
                            </div>
                        </div>

                        <!-- Botão -->
                        <div>
                            <button type="submit" id="cadastrar_reserva" class="btn btn-primary">
                                Cadastrar Movimentação
                            </button>
                        </div>

                    </div>
                </div>
            </div>
            </div>
        </form>
      </div>
    </div>
{% endblock %}
