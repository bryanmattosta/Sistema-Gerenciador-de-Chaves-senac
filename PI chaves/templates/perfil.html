{% extends 'base.html' %}

{% block titulo %} - Cadastrar Usuario{% endblock %}

{% block usuario %} Pedro {% endblock %}

{% block conteudo %}
    <div class="card">
      <div class="card-body">
        <form class="row g-3">
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Nome de Usuario</label>
                <input type="text" name="nome_usuario" class="form-control" placeholder="Nome do usuario">
            </div>
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Cargo</label>
                <input type="password" name="senha_usuario" class="form-control" placeholder="Cargo do Perfil">
            </div>
            <div class="col-6">
                <label for="inputAddress" class="form-label">Matricula</label>
                <input type="email" name="email_usuario" class="form-control" id="inputAddress" placeholder="Numero de Matricula">
            </div>
            <div class="col-6">
                <label for="inputAddress2" class="form-label">Foto do Usuario</label>
                <input type="file" class="form-control" name="foto_usuario" id="inputAddress2" >
            </div>
            <div class="col-12">
                <button type="submit" id="cadastrar_perfil" class="btn btn-primary">Cadastrar Perfil</button>
            </div>
        </form>
      </div>
    </div>

<!-- card pesquisa -->
 <div class="card mb-3" id="card_chave">
    <h3 style="text-align: center;">Pesquisa Perfil</h1>
    <hr>
    <div class="col-12">
    <div class="d-flex justify-content-center">
      <form method="get" action="{{ url_for('consultar_perfil') }}" role="search">
        <div class="d-flex justify-content-center">  
          <input type="text"class="form-control"id="formGroupExampleInput"placeholder="Pesquise a chave" name="perfil">
          <button class="btn btn-primary" type="submit">Buscar</button>
        </div>
      </form>
    </div>
    </div>
    <hr>
<div class="d-flex gap-3">
{% for perfil in perfis %}
<div class="card" style="width: 18rem;">
  <img src="..." class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">{{ perfil.nome_perfil }}</h5>
  </div>
  <ul class="list-group list-group-flush">
    <li class="list-group-item">{{ perfil.cargo }}</li>
    <li class="list-group-item">{{ perfil.matricula }}</li>
  </ul>
  <div class="card-body">
    <button type="button" class="btn btn-outline-warning">Editar</button>
    <button type="button" class="btn btn-outline-danger">Deletar</button>
  </div>
</div>
{% endfor %}
</div>
{% endblock %}
