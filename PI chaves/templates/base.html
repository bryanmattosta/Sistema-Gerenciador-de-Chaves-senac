<!DOCTYPE html>
<html lang="pt_br">
<head>
  <title>Senac- {% block titulo %}{% endblock %}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/estilo.css" type="text/css" media="all">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  
<header id="cabecalho">
<nav class="navbar navbar-custom fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Senac - {% block navbar %} {% endblock %} </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="offcanvas offcanvas-end div-custom" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
      <div class="offcanvas-header">
        <img src="/static/img/icon_user.png" alt="" style="width: 50px;"><h3>{% block usuario %} Pedro {% endblock %}</h3>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="div-custom">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Reserva</a>
          </li>
           <li class="nav-item">
            <a class="nav-link" href="#">Historico</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Chave</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Ambiente</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Usuario</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Movimentação</a>
          </li>
      </div>
    </div>
  </div>
</nav>
</header>

<main id="conteudo">
  {% block conteudo %}
    <div id="cardPrincipal">
      <div class="card" style="max-width: 400px;">
        <div class="card-header"></div>
      <div class="card-body">
    </div>
  {% endblock %}
</main>

<footer id="rodape">roda pe</footer>

</body>
</html>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
