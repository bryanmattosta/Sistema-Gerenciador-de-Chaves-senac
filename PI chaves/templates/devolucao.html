{% extends 'base.html' %}

{% block titulo %} - Home{% endblock %}

{% block usuario %} Pedro {% endblock %}


{% block conteudo %}
    <div class="card">
      <div class="card-body">
        <form class="row g-3">
<!-- Criar for para perfil -->
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Perfil</label>
                <input type="text" class="form-control" id="inputEmail4">
            </div>
<!-- Crirar for para Reserva -->
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Numero de Reserva</label>
                <input type="password" class="form-control" id="inputPassword4">
            </div>
            <div class="row col-12">

                <div class="col-7"></div>


                    <div class="d-flex align-items-end justify-content-end gap-2">

                         <!-- Observacao -->
                        <div class="col-8">
                            <label for="dataReserva" class="form-label">Observação</label>
                            <input type="text" class="form-control" id="dataReserva">
                        </div>

                        <!-- Data -->
                        <div>
                            <label for="dataReserva" class="form-label">Data</label>
                            <input type="date" class="form-control" id="dataReserva">
                        </div>

                        <!-- Horário -->
                        <div>
                            <label class="form-label">Horário</label>
                            <div class="d-flex align-items-center gap-1">
                                <input type="time" class="form-control" name="horario_inicio" id="horaInicio">
                                <span>:</span>
                                <input type="time" class="form-control" name="horario_fim" id="horaFim">
                            </div>
                        </div>

                        <!-- Botão -->
                        <div>
                            <button type="submit" id="cadastrar_reserva" class="btn btn-primary">
                                Cadastrar Devolução
                            </button>
                        </div>

                    </div>
                </div>
            </div>
            </div>
        </form>
      </div>
    </div>
{% endblock %}
